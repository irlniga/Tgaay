<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Online Tagay</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="app.css"></head>
<body data-mode="login"><main class="auth"><div class="glass">
<a href="index.html" class="logo">🥂 Online Tagay</a><h1 style="margin-top:14px">Welcome back</h1><p class="muted" style="margin-bottom:18px">Your barkada is waiting.</p>
<form id="f" novalidate>
<label>Email</label><input name="email" type="email" autocomplete="email" required>
<label>Password</label><input name="password" type="password" autocomplete="current-password" required>
<p style="margin:-6px 0 16px"><a href="#" id="forgot" class="muted" style="text-decoration:underline">Forgot password?</a></p>
<button class="btn gold" type="submit" style="width:100%">Login</button></form>
<p class="muted" style="margin-top:16px;text-align:center">New here? <a href="register.html" style="color:var(--gold2)">Create an account</a></p>
</div></main>
<script src="api/config.js"></script><script type="module" src="js/auth.js"></script></body></html>
